<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
  <title>Forgot Password — KA-KALAKBAY</title>
  <link rel="stylesheet" href="css/style.css"/>
  <style>
    body { background: #e8f0f3; min-height: 100vh; min-height: 100dvh; }
    :root.dark body { background: #020810; }

    .auth-page {
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: stretch;
      overflow-x: hidden;
    }
    .auth-topbar {
      width: 100%;
      min-height: calc(64px + var(--safe-top));
      background: linear-gradient(90deg, #fff 0%, var(--lime) 100%);
      display: flex;
      align-items: center;
      padding: var(--safe-top) max(var(--app-side-padding), var(--safe-left)) 0 max(var(--app-side-padding), var(--safe-right));
      gap: 1rem;
      position: sticky;
      top: 0;
      z-index: 50;
      flex-shrink: 0;
    }
    :root.dark .auth-topbar {
      background: linear-gradient(90deg, #111827 0%, #1a2520 100%);
    }
    .auth-body {
      flex: 1;
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding:
        clamp(1rem, 5vw, 2rem)
        max(var(--app-side-padding), var(--safe-left))
        calc(2.5rem + var(--safe-bottom))
        max(var(--app-side-padding), var(--safe-right));
    }
    .auth-card {
      background: #fff;
      border-radius: var(--radius);
      box-shadow: 0 8px 32px rgba(0,0,0,.13);
      padding: clamp(1.35rem, 5vw, 2.25rem);
      width: min(100%, var(--auth-max-width));
      max-width: var(--auth-max-width);
    }
    :root.dark .auth-card { background: #1e293b; }

    .auth-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .625rem;
      margin-bottom: 1.25rem;
    }
    .auth-card h1 {
      font-size: clamp(1rem, 4vw, 1.25rem);
      text-align: center;
      margin-bottom: .5rem;
      line-height: 1.2;
      color: var(--black);
    }
    .auth-card .subtitle {
      font-size: .82rem;
      text-align: center;
      color: var(--grey-t);
      margin-bottom: 1.5rem;
      line-height: 1.6;
    }
    .err-banner {
      display: none;
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: .875rem;
      padding: .7rem 1rem;
      margin-bottom: 1rem;
      color: #dc2626;
      font-size: .85rem;
    }
    @media (min-width: 640px) {
      .auth-card { padding: 2.25rem 2.25rem 2.5rem; }
    }

    @media (max-width: 480px) {
      .auth-body {
        align-items: flex-start;
        padding-top: 1.25rem;
      }

      .auth-card {
        border-radius: 20px;
      }
    }
  </style>
</head>
<body>
<div id="appLoader" class="app-loader" aria-live="polite" aria-label="Loading KA-KALAKBAY">
  <div class="app-loader-card">
    <img
      src="assets/images/KA-KALAKBAY.svg"
      alt="KA-KALAKBAY Logo"
      class="app-loader-logo"
    />

    <p id="appLoaderText" class="app-loader-text">Loading KA-KALAKBAY</p>

    <div class="app-loader-dots" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<div class="auth-page">

  <!-- TOPBAR -->
  <header class="auth-topbar">
    <a href="login.html" aria-label="Back to sign in">
      <svg class="topbar-logo" viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg">
        <polygon points="68.58,302.06 125.97,302.06 125.97,193.1 217.49,302.06 290.92,302.06 189.24,186.09 290.4,70.03 217.69,69.52 126.49,173.45 126.49,69.52 68.58,69.52" fill="currentColor"/>
        <rect x="103.03" y="163.68" width="44.21" height="44.21" fill="currentColor"/>
        <path fill="#ED1C24" d="M249.14,297.74l-48.09-92.86c-13.13-25.35-4.4-56.54,19.98-71.39c17.28-10.53,38.97-10.58,56.3-0.14l0.18,0.11c24.63,14.83,33.44,46.29,20.1,71.76L249.14,297.74z"/>
        <circle fill="#fff" cx="249.39" cy="178.41" r="33.24"/>
      </svg>
    </a>
    <span class="topbar-title">KA-KALAKBAY</span>
  </header>

  <div class="auth-body">

    <!-- FORM STATE -->
    <div class="auth-card" id="form-card">

      <!-- Brand mark -->
      <div class="auth-brand">
        <svg viewBox="0 0 360 360" xmlns="http://www.w3.org/2000/svg" width="32" height="32" aria-hidden="true">
          <polygon points="68.58,302.06 125.97,302.06 125.97,193.1 217.49,302.06 290.92,302.06 189.24,186.09 290.4,70.03 217.69,69.52 126.49,173.45 126.49,69.52 68.58,69.52" fill="#27667B"/>
          <rect x="103.03" y="163.68" width="44.21" height="44.21" fill="#27667B"/>
          <path fill="#ED1C24" d="M249.14,297.74l-48.09-92.86c-13.13-25.35-4.4-56.54,19.98-71.39c17.28-10.53,38.97-10.58,56.3-0.14l0.18,0.11c24.63,14.83,33.44,46.29,20.1,71.76L249.14,297.74z"/>
          <circle fill="#fff" cx="249.39" cy="178.41" r="33.24"/>
        </svg>
      </div>

      <h1>Password Recovery</h1>
      <p class="subtitle">
        Enter your email address and we'll send you a link to reset your password.
      </p>

      <div id="auth-err" class="err-banner"></div>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="email">Email</label>
          <input id="email" type="email" placeholder="your@email.com"
                 autocomplete="email" required/>
          <span class="err-msg" id="email-err" role="alert"></span>
        </div>
        <button type="submit" id="send-btn" class="btn btn-primary mb-2">
          Send Reset Link
        </button>
      </form>

      <p class="text-center" style="font-size:.875rem;margin-top:.625rem;">
        <a href="login.html" class="btn-link">← Back to Sign In</a>
      </p>
    </div>

    <!-- SUCCESS STATE -->
    <div class="auth-card hidden" id="success-card">
      <div style="text-align:center;padding:.5rem 0;">
        <div style="font-size:3rem;margin-bottom:.875rem;">📧</div>
        <h1 style="margin-bottom:.625rem;">Email Sent!</h1>
        <p style="font-size:.87rem;color:var(--grey-t);line-height:1.65;margin-bottom:1.5rem;">
          A password reset link has been sent to your email address.
          Check your inbox and follow the instructions.
        </p>
        <a href="login.html" class="btn btn-primary">Back to Sign In</a>
      </div>
    </div>

  </div>
</div>

<script type="module" src="js/forgot-password.js"></script>
</body>
</html>
